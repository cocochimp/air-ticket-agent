<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>退改签助手 · Agent 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366F1' stroke-width='2'%3E%3Cpath d='M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script>
    // 首帧前应用主题，避免闪烁
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>
  <div class="app">
    <nav class="sidenav" aria-label="主导航">
      <div class="brand" aria-hidden="true"><span data-icon="plane"></span></div>
      <ul class="nav-list" id="nav"></ul>
    </nav>
    <header class="topbar">
      <div class="topbar-title">
        <h1>退改签助手</h1>
        <span class="badge badge-demo" title="所有航班、订单、旅客均为虚构演示数据"><span data-icon="flask"></span>演示数据</span>
      </div>
      <div class="topbar-actions">
        <div class="segmented" role="radiogroup" aria-label="决策模式" id="mode-switch"></div>
        <label class="select-wrap" for="user-select">
          <span class="sr-only">当前用户</span>
          <span data-icon="user" aria-hidden="true"></span>
          <select id="user-select" class="select"></select>
        </label>
        <span class="badge" id="retrieval-badge" role="status">检索 …</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换浅色/深色主题"></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="overlay-root"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
